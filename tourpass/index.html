<html>
<head>
  <title>TourPass | Biglietti Turistici</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Calendario -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <!-- Stile -->
  <link rel="stylesheet" href="style.css"/>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Calendario -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/it.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/cs.js"></script>
</head>
<body>

  <!-- Pulsante torna alla homepage -->
  <a href="../index.html" class="back-home-btn">
    ← Home
  </a>

  <!-- Sfondi -->
  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>
  <div class="bg-overlay"></div>

  <!-- Barra lingue -->
  <div class="lang-bar">
    <div class="lang-slider" id="langSlider"></div>
    <button class="lang-btn active" data-lang="it">🇮🇹 IT</button>
    <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
    <button class="lang-btn" data-lang="cs">🇨🇿 CZ</button>
  </div>

  <main class="app-wrap">

    <section id="bookingCard" class="card">

      <div class="card-header">
        <div class="logo-mark">✦</div>
        <h1 id="txt-titolo">TourPass</h1>
        <p id="txt-slogan" class="slogan">Esplora il mondo, un tour alla volta</p>
      </div>

      <div class="divider"></div>

      <div class="form-section">
        <div class="form-group">
          <label id="lbl-tour" for="nomeTour">Tipo di Tour</label>
          <div class="select-wrap">
            <select id="nomeTour"></select>
            <span class="select-icon">▾</span>
          </div>
        </div>

        <div class="form-group">
          <label id="lbl-persone" for="numPersone">Numero Partecipanti</label>
          <div class="number-input">
            <button type="button" class="num-btn" id="numMinus">−</button>
            <input type="number" id="numPersone" value="1" min="1" max="20" readonly />
            <button type="button" class="num-btn" id="numPlus">+</button>
          </div>
        </div>

        <div class="form-group">
          <label id="lbl-data" for="dataTour">Data</label>
          <input type="text" id="dataTour" class="field-input" readonly autocomplete="off">
        </div>

        <div class="form-group">
          <label id="lbl-orario" for="fasciaOraria">Fascia oraria</label>
          <div class="select-wrap">
            <select id="fasciaOraria"></select>
          </div>
        </div>

        <div class="form-group">
          <label id="lbl-valuta" for="valutaSelect">Valuta</label>
          <div class="select-wrap">
            <select id="valutaSelect"></select>
          </div>
        </div>
      </div>

      <div id="partecipantiContainer"></div>

      <div class="price-preview" id="pricePreview">
        <span id="txt-totale-label">Totale stimato</span>
        <span id="totalDisplay" class="price-amount">€0</span>
      </div>

      <button id="btnPrenota" class="primary-btn">
        <span id="txt-prenota">Genera biglietto</span>
        <span class="btn-arrow">→</span>
      </button>

      <div id="statusMessage" class="status hidden"></div>
    </section>

    <section id="resultView" class="result-view hidden">

      <div class="ticket-preview">
        <div class="ticket-header">
          <span class="ticket-logo">✦ TourPass</span>
          <span class="ticket-date" id="ticketDateDisplay"></span>
        </div>

        <div class="ticket-body" id="ticketBody"></div>

        <div class="ticket-footer">
          <span id="ticketTourName"></span>
          <span id="ticketTotal" class="ticket-total-label"></span>
        </div>
        <div class="ticket-tear"></div>
      </div>

      <div class="result-actions">
        <h2 id="readyTitle">Biglietto pronto!</h2>
        <p id="readyText">Scarica il PDF.</p>

        <a id="downloadPdfLink" class="primary-btn" href="#" download>
          <span id="txt-download">⬇ Scarica PDF</span>
        </a>

        <button id="backBtn" class="secondary-btn">
          ← <span id="txt-back">Torna indietro</span>
        </button>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
